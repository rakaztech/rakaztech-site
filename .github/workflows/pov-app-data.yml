# يحدّث بيانات تطبيق POV من صفحة الدليل (rakaztech/pov-guide).
# - فوري: مستودع الدليل يرسل إشارة pov-guide-updated أول ما يتعدل (يحتاج سر APP_SYNC_TOKEN هناك).
# - احتياط: كل 10 دقايق (جدول GitHub يتأخر ويفوّت تشغيلات، فما نعتمد عليه بروحه).
name: POV app data
on:
  repository_dispatch:
    types: [pov-guide-updated]
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
concurrency:
  group: pov-app-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch guide page
        run: curl -fsSL https://raw.githubusercontent.com/rakaztech/pov-guide/main/index.html -o /tmp/guide.html
      - name: Generate
        run: node tools/pov-app-data.mjs /tmp/guide.html pov-app
      - name: Publish if changed
        run: |
          git add pov-app
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "rakaz-bot"
          git config user.email "hello@rakaztech.com"
          git commit -q -m "POV app data: $(date -u +%F)"
          git push
